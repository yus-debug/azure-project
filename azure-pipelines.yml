trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'YOURNAME-todoacr'
  acrLoginServer: 'YOURNAME-todoacr.azurecr.io'
  imageName: 'todo-app'
  webAppName: 'todo-app-YOURNAME'
  resourceGroup: 'rg-todo-cicd'

stages:
  - stage: CI
    displayName: 'CI - Build and Test'
    jobs:
      - job: BuildAndTest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js'

          - script: |
              npm install
              npm test -- --watchAll=false --ci
            displayName: 'Install and Test'

          - script: npm run build
            displayName: 'Build React App'

  - stage: CD_Build
    displayName: 'CD - Docker Build and Push'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: DockerBuildPush
        steps:
          - task: Docker@2
            displayName: 'Build and Push to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: 'Dockerfile'
              containerRegistry: 'acr-service-connection'
              tags: |
                latest
                $(Build.BuildId)